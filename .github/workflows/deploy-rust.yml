name: Deploy Rust
concurrency: Crates.io

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-check:
    permissions:
      contents: read
      issues: write
      actions: write
    uses: ./.github/workflows/rust.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: install jaq
      uses: taiki-e/install-action@v2.90.3
      with:
        tool: |
          jaq
          parse-changelog
    - id: version
      name: get version
      run: |
        v="$(jaq -cr .package.version Cargo.toml)"
        echo "version: $v"
        
        echo "version=$v" >> $GITHUB_OUTPUT
        echo "# version $v" >> $GITHUB_STEP_SUMMARY
    - id: changelog
      name: validate changelog
      run: | 
        parse-changelog CHANGELOG.md ${{ steps.version.outputs.version }}
        echo "## Changelog entry" >> $GITHUB_STEP_SUMMARY
        echo "$(parse-changelog CHANGELOG.md ${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY

  publish_lib:
    needs:
      - version
      - quality-check
    if: ${{ needs.version.result == 'success' && needs.quality-check.result == 'success' }}
    environment: crates.io
    permissions:
      # id-token: write is only needed for the OIDC login below; kept so it can be
      # re-enabled by uncommenting that step after the first version is published.
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    # Install manually as different crates may have custom toolchains defined
    - name: install rust
      run: rustup set profile default && rustup install

    # Re-enable this step once the first version is published.
    # ========================================================
    # Disabled for now: crates.io does not allow the initial publish of a crate via
    # OIDC, so the first version must be published with an API token instead.
    # # Use OIDC for updating existing crates.
    # - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 #v1.0.6
    #   id: auth

    - name: Publish
      # Remove env after first version is published
      # ===========================================
      env:
        # API token provided as the CARGO_REGISTRY_TOKEN secret on the crates.io environment
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run:
        cargo publish

  github_release:
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      attestations: write
      contents: write
    needs:
      - version
      - publish_lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install tools
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: parse-changelog
      - name: publish release
        run: parse-changelog CHANGELOG.md ${{ needs.version.outputs.version }} | gh release create v${{ needs.version.outputs.version }} --notes-file -
