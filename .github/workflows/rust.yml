name: Rust

on:
  push:
    paths: 
    - "**.rs"
    - "Cargo.toml"
    - "rust-toolchain.toml"
    - ".github/workflows/rust.yml"
  pull_request:
  workflow_call:
  schedule:
    - cron: '30 4 * * 6'

env:
    CARGO_TERM_COLOR: always

jobs:

  skip_check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'

  test:
    needs: skip_check
    if: ${{ github.event_name == 'workflow_call' || needs.skip_check.outputs.should_skip != 'true' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest toolchain from rust-toolchain.toml
      run: |
        rustup install
        rustup update
    - name: Run tests
      run: cargo test --no-fail-fast

  lint:
    needs: skip_check
    if: ${{ github.event_name == 'workflow_call' || needs.skip_check.outputs.should_skip != 'true' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest toolchain from rust-toolchain.toml
      run: |
        rustup install
        rustup update
    - name: clippy
      run: cargo clippy -- --deny warnings

  fmt:
    needs: skip_check
    if: ${{ github.event_name == 'workflow_call' || needs.skip_check.outputs.should_skip != 'true' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest toolchain from rust-toolchain.toml
      run: |
        rustup install
        rustup update
    - name: fmt
      run: cargo fmt --check

  miri:
    needs: skip_check
    if: ${{ github.event_name == 'workflow_call' || needs.skip_check.outputs.should_skip != 'true' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install latest toolchain from rust-toolchain.toml
      run: |
        rustup install
        rustup update
    - name: install nextest
      uses: taiki-e/install-action@v2.90.3
      with:
        tool: |
          nextest
    - name: Run tests
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
      run: cargo miri nextest run --no-fail-fast --examples --tests

  report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [skip_check, test, lint, fmt, miri]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Create issue on failure
      if: ${{ needs.skip_check.result == 'failure' || needs.test.result == 'failure' || needs.lint.result == 'failure' || needs.fmt.result == 'failure' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh issue list --state open --search "Weekly CI failed in:title" --json body --jq '.[].body' | grep -q "Run ID: $GITHUB_RUN_ID"; then
          echo "Issue already exists for run $GITHUB_RUN_ID"
        else
          gh issue create --title "Weekly CI failed" --body "Run ID: $GITHUB_RUN_ID" --assignee "MusicalNinjaDad"
        fi
