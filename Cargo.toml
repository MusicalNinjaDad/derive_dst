[package]
name = "derive_dst"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "Derive macro for DST structs: generates a private `UninitFoo` MaybeUninit mirror, safe allocation constructors (`new_uninit_for_size` / `new_uninit_for_count` returning the box with its `Layout`, tail offset & count), an unsafe `assume_init`, and layout constructors (`layout_for_size` / `layout_for_count`) returning `LayoutError`. Requires nightly."
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
keywords = ["derive", "DST", "unsized", "layout", "ffi"]
repository = "https://github.com/MusicalNinjaDad/derive_dst"
categories = ["development-tools", "no-std"]
license = "MIT"
exclude = [".github", ".devcontainer", ".vibe"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
proc-macro2 = "1.0.106"
proc_macro2_diagnostic = "0.8.1"
quote = "1.0.45"

[dev-dependencies]
trybuild = "1.0.116"

[workspace.metadata.ninja-xtask]
env = { "LD_LIBRARY_PATH" = false }
